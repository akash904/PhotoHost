<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>PhotoHost</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header id="topbar">
  <div class="brand">PhotoHost</div>
  <nav id="views">
    <button id="viewLibrary" class="ghost active">Library</button>
    <button id="viewTrash" class="ghost">Trash</button>
  </nav>
  <div class="spacer"></div>
  <div id="count" class="muted"></div>
  <button id="upload" class="ghost" title="Add photos and videos from this device (or drop them anywhere on the page)">Upload</button>
  <button id="select" class="ghost" title="Select items">Select</button>
  <button id="rescan" class="ghost" title="Scan the library for new files">Scan</button>
  <input id="uploadInput" type="file" multiple hidden
         accept="image/*,video/*,.heic,.heif,.avif,.dng,.cr2,.cr3,.nef,.arw,.orf,.rw2,.raf,.srw,.mkv,.3gp">
</header>

<!-- Replaces the top bar while items are selected, so the destructive action is never adjacent
     to the navigation it would be easy to hit by accident. -->
<div id="actionbar" class="hidden">
  <button id="selClear" class="ghost">✕</button>
  <strong id="selCount"></strong>
  <div class="spacer"></div>
  <button id="selAll" class="ghost">All</button>
  <button id="selFav" class="ghost">★</button>
  <button id="selRestore" class="ghost hidden">Restore</button>
  <button id="selDelete" class="ghost danger">Delete</button>
</div>

<main id="grid" aria-label="Photo timeline"></main>
<main id="trashGrid" class="hidden" aria-label="Trash"></main>
<section id="sources" class="hidden"></section>

<div id="sentinel"></div>

<nav id="scrubber" aria-label="Jump to month"></nav>

<div id="empty" class="hidden">
  <h2>Nothing here yet</h2>
  <p class="muted">Drag photos and videos onto this page, or press <strong>Upload</strong>.
    Files put straight into the library folder appear after <strong>Scan</strong>.</p>
</div>

<!-- Shown only while files are dragged over the page. It ignores the pointer, so the drag events
     keep going to the page underneath and a drop anywhere counts. -->
<div id="dropzone" class="hidden"><div>Drop photos and videos to add them to the library</div></div>

<div id="uploads" class="hidden" role="status" aria-live="polite">
  <div class="uhead">
    <strong id="upTitle"></strong>
    <div class="spacer"></div>
    <button id="upCancel" class="ghost">Cancel</button>
    <button id="upClose" class="ghost" aria-label="Close">✕</button>
  </div>
  <div class="ubar"><div id="upBar"></div></div>
  <div id="upLine" class="muted"></div>
  <details id="upFailed" class="hidden"><summary></summary><ul></ul></details>
</div>

<!-- Fullscreen viewer. Kept in the DOM rather than created on demand so opening is instant. -->
<div id="viewer" class="hidden" role="dialog" aria-modal="true">
  <div id="viewerMedia"></div>
  <button id="vClose" class="vbtn" style="top:10px;right:10px" aria-label="Close">&times;</button>
  <button id="vPrev" class="vbtn vnav" style="left:10px" aria-label="Previous">&#8249;</button>
  <button id="vNext" class="vbtn vnav" style="right:10px" aria-label="Next">&#8250;</button>
  <button id="vInfo" class="vbtn" style="top:10px;right:60px" aria-label="Info">i</button>
  <aside id="viewerInfo" class="hidden"></aside>
</div>

<script src="/app.js"></script>
</body>
</html>
